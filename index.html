<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script defer src="script.js"></script>
</head>
<body>

<!-- MUSIC (PLAYS ONCE, NEVER RESTARTS) -->
<audio id="bgMusic" autoplay loop>
  <source src="music/love.mp3" type="audio/mpeg">
</audio>

<div class="letters"></div>

<!-- HOME -->
<section class="section active hero" id="home">
  <h1 class="title">A Special Journey</h1>
  <p class="subtitle">Made with love, just for you</p>
  <button onclick="go('story')">Begin ❤️</button>
</section>

<!-- STORY -->
<section class="section glass" id="story">
  <h2>Our Story</h2>
  <p>
    Every smile, every moment, every memory<br>
    became my favorite chapter with you.
  </p>
  <button onclick="go('gallery')">Next 💕</button>
</section>

<!-- GALLERY -->
<section class="section glass" id="gallery">
  <h2>Captured Memories</h2>
  <div class="gallery">
    <img src="images/img1.jpg">
    <img src="images/img2.jpg">
    <img src="images/img3.jpg">
  </div>
  <button onclick="go('final')">Final ❤️</button>
</section>

<!-- FINAL -->
<section class="section hero" id="final">
  <h1 class="title">Happy Birthday ❤️</h1>
  <div id="timer"></div>
  <button onclick="revealLove()">Tap Gently 💖</button>

  <div class="love-reveal" id="loveReveal">
    <span>I</span>
    <span>LOVE</span>
    <span>YOU</span>
  </div>
</section>

</body>
</html>
