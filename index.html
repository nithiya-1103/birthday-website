<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Birthday ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script defer src="script.js"></script>
</head>
<body>

<!-- Hidden music player -->
<iframe src="player.html" style="display:none;" id="musicFrame"></iframe>

<!-- Fireworks Canvas -->
<canvas id="fireworks"></canvas>

<!-- Floating Hearts -->
<div class="letters"></div>

<!-- Home Section -->
<section class="section" id="home">
  <h1 class="title">A Special Journey</h1>
  <p class="subtitle">Made with love, just for you</p>
  <p class="hint">🎧 Tap to start the music</p>
  <button onclick="showSection('story')">Begin ❤️</button>
</section>

<!-- Story Section (hidden initially) -->
<section class="section" id="story" style="display:none;">
  <h2>Our Story</h2>
  <p>Every smile, every moment, every memory became my favorite chapter with you.</p>
  <button onclick="navigateTo('story.html')">Next 💕</button>
</section>

</body>
</html>
