<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Our Special Journey ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500&family=Great+Vibes&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
<script defer src="script.js"></script>
</head>
<body>

<audio id="bgMusic" loop></audio>
<div class="letters"></div>

<section class="section active" id="cakePage">
    <h1 class="title cakeTitle">Happiee Birthday<br>My Dear Paapuu 💕</h1>

    <div class="cake-container">
        <div class="cake">
            <div class="candle" id="candle">
                <div class="flame" id="flame"></div>
            </div>
            <div class="frosting top"></div>
            <div class="layer2"></div>
            <div class="layer1"></div>
        </div>
    </div>

    <div class="button-group">
        <button id="lightCandleBtn">Light the Candle 🕯️</button>
        <button id="nextPageBtn">Next Surprise 🎁</button>
    </div>
</section>

<section class="section" id="home">
    <h1 class="title">My Dear Doctor 🩺</h1>
    <p class="subtitle">I made this little digital world only for you — filled with love, memories & smiles.</p>
    <button onclick="startExperience('story')">Begin ❤️</button>
</section>

<section class="section" id="story">
    <h1 class="title">Our Story</h1>
    <p class="subtitle">Every smile with you became my favorite chapter.</p>
    <button onclick="showSection('gallery')">Our Memories 💕</button>
</section>

<section class="section glass" id="gallery">
    <h1 class="title">Our Beautiful Moments</h1>

    <div class="memory-frame-grid" id="memoryGrid">
        <div class="memory-card"><img src="images/img1.jpg"></div>
        <div class="memory-card"><img src="images/img2.jpg"></div>
        <div class="memory-card"><img src="images/img3.jpg"></div>
        <div class="memory-card"><img src="images/img4.jpg"></div>
        <div class="memory-card"><img src="images/img5.jpg"></div>
        <div class="memory-card"><img src="images/img6.jpg"></div>

        <div class="memory-card"><video src="videos/vid1.mp4" autoplay muted loop playsinline></video></div>
        <div class="memory-card"><video src="videos/vid2.mp4" autoplay muted loop playsinline></video></div>
        <div class="memory-card"><video src="videos/vid3.mp4" autoplay muted loop playsinline></video></div>
        <div class="memory-card"><video src="videos/vid4.mp4" autoplay muted loop playsinline></video></div>
        <div class="memory-card"><video src="videos/vid5.mp4" autoplay muted loop playsinline></video></div>
        <div class="memory-card"><video src="videos/vid6.mp4" autoplay muted loop playsinline></video></div>
    </div>

    <button onclick="showSection('final')">Final Surprise ❤️</button>
</section>

<section class="section" id="final">
    <h1 class="title">Forever Yours</h1>
    <div id="timer" class="subtitle"></div>
    <button onclick="revealLove()">Tap Gently 💖</button>
    <div class="love-reveal" id="loveReveal"></div>
</section>

<canvas id="confettiCanvas"></canvas>

</body>
</html>
