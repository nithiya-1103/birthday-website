<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Special Journey ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;600&family=Dancing+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>

<audio id="bgMusic" loop></audio>
<div class="letters"></div>
<div id="particles-js"></div>

<section class="section active" id="cakePage">
    <div class="glass-card">
        <h1 class="title">HAPPIEE BIRTHDAY<br><span class="highlight">MY DEAR PAAPUU</span> 😘💕</h1>
        <div class="cake-platform">
            <div class="cake-3d">
                <div class="frosting-glow"></div>
                <div class="cake-layer vanilla"></div>
                <div class="cake-layer chocolate"></div>
                <div class="candle-3d" id="candle">
                    <div class="flame-advanced" id="flame"></div>
                </div>
            </div>
        </div>
        <div class="action-area">
            <button class="btn-primary" id="lightCandleBtn">LIGHT UP THE MAGIC 🕯️</button>
            <button class="btn-primary" id="nextPageBtn">NEXT 🎁</button>
        </div>
    </div>
</section>

<section class="section" id="home">
    <div class="glass-card">
        <h1 class="title">MY DEAR DOCTOR!! 🩺</h1>
        <p class="subtitle">A little digital world made with love across the miles.</p>
        <button class="btn-primary" onclick="showSection('story')">Begin ❤️</button>
    </div>
</section>

<section class="section" id="gallery">
    <h1 class="title">Captured Memories</h1>
    <div class="memory-frame-grid" id="memoryGrid">
        <div class="memory-card"><img src="images/img1.jpg" alt="Memory 1"></div>
        <div class="memory-card"><img src="images/img2.jpg" alt="Memory 2"></div>
        <div class="memory-card"><img src="images/img3.jpg" alt="Memory 3"></div>
        <div class="memory-card"><img src="images/img4.jpg" alt="Memory 4"></div>
        <div class="memory-card"><img src="images/img5.jpg" alt="Memory 5"></div>
        <div class="memory-card"><img src="images/img6.jpg" alt="Memory 6"></div>
        <div class="memory-card"><video src="videos/vid1.mp4" autoplay muted loop playsinline></video></div>
        <div class="memory-card"><video src="videos/vid2.mp4" autoplay muted loop playsinline></video></div>
        <div class="memory-card"><video src="videos/vid3.mp4" autoplay muted loop playsinline></video></div>
        <div class="memory-card"><video src="videos/vid4.mp4" autoplay muted loop playsinline></video></div>
        <div class="memory-card"><video src="videos/vid5.mp4" autoplay muted loop playsinline></video></div>
        <div class="memory-card"><video src="videos/vid6.mp4" autoplay muted loop playsinline></video></div>
    </div>
    <button class="btn-primary" onclick="showSection('final')">Final ❤️</button>
</section>

<section class="section" id="final">
    <div class="glass-card">
        <h1 class="title">Forever Yours ❤️</h1>
        <button class="btn-primary" onclick="revealLove()">Tap Gently 💖</button>
        <div id="loveReveal" class="subtitle" style="display:none; margin-top:20px;"></div>
    </div>
</section>

<canvas id="confettiCanvas"></canvas>
<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
</body>
</html>
